<!DOCTYPE html>
<html lang="pt-br" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · Math Magic</title>
  <link href="css/bootstrap/bootstrap.css" rel="stylesheet">
  <link href="css/EstilosEntrada.css" rel="stylesheet">
  <link rel="icon" type="image/png" href="img/LogoOF.jpg">
</head>
<body>
  <main class="cartao">
    <div class="marca">
      <div class="logo" aria-hidden="true">&Sigma;</div>
      <h1 class="nome-marca">Math Magic</h1>
      <p class="subtitulo">Entre para continuar</p>
    </div>

    <form id="formulario">
      <div class="campo">
        <label for="email">E-mail</label>
        <input type="email" class="form-control" id="email" placeholder="voce@email.com" required>
        <div class="invalid-feedback">Digite um e-mail válido.</div>
      </div>

      <div class="campo">
        <label for="senha">Senha</label>
        <input type="password" class="form-control" id="senha" placeholder="Sua senha" required>
        <div class="invalid-feedback">Digite sua senha.</div>
      </div>

      <div class="form-check opcoes">
        <input class="form-check-input" type="checkbox" id="lembrar">
        <label class="form-check-label" for="lembrar">Manter conectado</label>
      </div>

      <button type="button" class="btn btn-principal" onclick="Login()">Entrar</button>
    </form>

    <p class="rodape">Não tem conta? <a href="Cadastro.html">Criar conta</a></p>
  </main>
  <script src="js/login.js"></script>
  <script src="js/verificarLogin.js"></script>
  <script src="js/loginAtivo.js"></script>
</body>
</html>
